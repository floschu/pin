name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  github-release:
    name: Build and Release
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: |
          xcodegen generate
          xcodebuild \
            -project Pin.xcodeproj \
            -scheme Pin \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            build

      - name: Package
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/Pin.app "Pin-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "Pin-${GITHUB_REF_NAME}.zip"
